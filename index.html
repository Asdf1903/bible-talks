<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bible Talks · Studies by Neil Whatmough</title>
  <meta name="description" content="Bible studies, prophecy, doctrine and good news. A new study every week by Neil Whatmough.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&display=swap">

  <link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/site.css">

  <!-- Modo claro/oscuro guardado, antes de pintar (evita un destello) -->
  <script>
    try {
      var savedTheme = localStorage.getItem("bt-theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<!--
  PORTADA (index.html)
  Estructura: fondo con grabados → la hoja (.sheet) → dentro: encabezado,
  la cinta (banner), las 4 secciones, recientes, "Coming soon", pie.
  Las 4 secciones viven en ESTA misma página: index.html#good-news, etc.
  (no hay otro HTML: se esconde la portada y se muestra #sectionView).
  Todo lo de estudios se llena solo desde Firestore (assets/home.js).
-->
<body class="site">
  <div class="sheet">

    <!-- Encabezado -->
    <header class="site-head wrap">
      <a class="logo" href="#" aria-label="Bible Talks, home">
        <!-- Logo: libro abierto que también es un globo de diálogo (sin cruz) -->
        <svg viewBox="0 0 120 84" aria-hidden="true">
          <path class="l-navy" d="M4 22 L12 17 L12 62 C28 58 46 60 58 68 L58 72 C44 64 24 63 4 68 Z"/>
          <path class="l-navy" d="M116 22 L108 17 L108 62 C92 58 74 60 62 68 L62 72 C76 64 96 63 116 68 Z"/>
          <path class="l-gold" d="M60 18 C52 9 34 6 18 8 L18 56 C34 54 50 57 60 66 Z"/>
          <path class="l-gold" d="M60 18 C68 9 86 6 102 8 L102 56 C86 54 70 57 60 66 Z"/>
          <path class="l-page" d="M57 21 C50 14 36 12 22 13 L22 52 C36 51 49 54 57 60 Z"/>
          <path class="l-page" d="M63 21 C70 14 84 12 98 13 L98 52 C84 51 71 54 63 60 Z"/>
          <path class="l-line" fill="none" stroke-width="2" stroke-linecap="round"
                d="M28 23 C36 22.5 44 23.5 51 27 M28 31 C36 30.5 44 31.5 51 35 M28 39 C36 38.5 44 39.5 51 43 M28 47 C34 46.6 40 47.2 45 49
                   M92 23 C84 22.5 76 23.5 69 27 M92 31 C84 30.5 76 31.5 69 35 M92 39 C84 38.5 76 39.5 69 43 M92 47 C86 46.6 80 47.2 75 49"/>
          <path class="l-gold" d="M55 63 C56 70 53 76 46 82 C57 81 63 75 65 64 Z"/>
        </svg>
        <span class="logo-word">BIBLE<b>TALKS</b></span>
      </a>

      <nav class="site-nav" id="siteNav" aria-label="Main menu">
        <a href="#" aria-current="page">Home</a>
        <a href="#good-news">Good News</a>
        <a href="#doctrine">Doctrine</a>
        <a href="#bible-study">Bible Study</a>
        <a href="#prophecy">Prophecy</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>

      <div class="head-tools">
        <button class="round-btn" id="themeBtn" aria-label="Switch to light mode">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <button class="round-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="siteNav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </header>

    <!-- ===== PORTADA (sin nada después del #, o "#") ===== -->
    <main id="homeView">
      <!-- La cinta: versículo de la semana, el estudio nuevo y 2 del archivo.
           La arma assets/home.js sola (ver la explicación arriba de ese archivo). -->
      <section class="ribbon" id="ribbon" aria-roledescription="carousel" aria-label="Featured">
        <div class="ribbon-track" id="ribbonTrack"></div>
        <button class="ribbon-arrow prev" id="ribbonPrev" aria-label="Previous">‹</button>
        <button class="ribbon-arrow next" id="ribbonNext" aria-label="Next">›</button>
        <div class="ribbon-dots" id="ribbonDots"></div>
      </section>

      <!-- Las 4 secciones: nombre + una línea, para quien llega por primera vez -->
      <section class="block wrap">
        <h2 class="block-title">Explore</h2>
        <div class="sections" id="sections"></div>
      </section>

      <!-- Recientes -->
      <section class="block wrap" id="recentBlock" hidden>
        <h2 class="block-title">Recent studies</h2>
        <div class="recent" id="recent"></div>
      </section>

      <!-- Lo que Neil ya programó -->
      <section class="block wrap" id="upcomingBlock" hidden>
        <h2 class="block-title">Coming soon</h2>
        <ul class="upcoming" id="upcoming"></ul>
      </section>
    </main>

    <!-- ===== UNA SECCIÓN (#good-news, #doctrine, #bible-study, #prophecy) =====
         Misma página: solo se esconde la portada y se muestra esto.
         Arriba, un marco redondeado que deja ver el grabado; abajo, los estudios en mosaico. -->
    <main id="sectionView" class="wrap" hidden>
      <header class="cat-head" id="catHead">
        <span class="tile-icon" id="catIcon"></span>
        <h1 id="catTitle"></h1>
        <p class="cat-about" id="catAbout"></p>
        <p class="cat-count" id="catCount"></p>
      </header>

      <div class="study-grid" id="studyGrid" aria-labelledby="catTitle"></div>
      <p class="cat-empty" id="catEmpty" hidden>No studies here yet. Please come back soon.</p>
    </main>

    <footer class="site-foot wrap">
      <span>© <span id="year">2026</span> Neil Whatmough · Bible Talks</span>
      <nav aria-label="Footer">
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </footer>
  </div>

  <script src="assets/site.js"></script>
  <script type="module" src="assets/home.js"></script>
</body>
</html>
